name: Validate account access
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/account-check.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
